apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flask-app-secret
  namespace: prod
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: flask-app-secret-k8s  
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: flask-app-secret
        property: password
