apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: mysql
        image: {{ .Values.mysql.image }}
        ports:
          - containerPort: 3306
        env:
          - name: MYSQL_ROOT_PASSWORD
            value: {{ .Values.mysql.rootPassword }}
          - name: MYSQL_DATABASE
            value: {{ .Values.mysql.database }}
          - name: MYSQL_USER
            value: {{ .Values.mysql.user }}
          - name: MYSQL_PASSWORD
            value: {{ .Values.mysql.password }}
        volumeMounts:
          - name: mysql-data
            mountPath: /var/lib/mysql
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 20
          periodSeconds: 5
      volumes:
        - name: mysql-data
          {{- if .Values.mysql.useExistingPVC }}
          persistentVolumeClaim:
            claimName: {{ .Values.mysql.pvcName }}
          {{- else }}
          emptyDir: {}
          {{- end }}

