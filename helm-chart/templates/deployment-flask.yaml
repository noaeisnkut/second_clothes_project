apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask_app
          image: noa10203040/flask_app:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "noa10203040"
            - name: DB_HOST
              value: "my-postgress-db.cc3m62swkfac.us-east-1.rds.amazonaws.com"
            - name: DB_NAME
              value: "flask"
            - name: DB_PORT
              value: "5432"
            - name: AWS_ACCESS_KEY_ID
              value: "<your_aws_access_key>"
            - name: AWS_SECRET_ACCESS_KEY
              value: "<your_aws_secret_key>"
            - name: AWS_REGION
              value: "us-east-1"
            - name: SECRET_KEY
              value: "dev_secret_key"

        - name: test_app
          image: noa10203040/flask_app:latest
          command: ["pytest", "/app/app_test.py"]
          env:
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "noa10203040"
            - name: DB_HOST
              value: "my-postgress-db.cc3m62swkfac.us-east-1.rds.amazonaws.com"
            - name: DB_NAME
              value: "flask"
            - name: DB_PORT
              value: "5432"
            - name: AWS_ACCESS_KEY_ID
              value: "<your_aws_access_key>"
            - name: AWS_SECRET_ACCESS_KEY
              value: "<your_aws_secret_key>"
            - name: AWS_REGION
              value: "us-east-1"
            - name: SECRET_KEY
              value: "dev_secret_key"
