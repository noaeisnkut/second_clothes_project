apiVersion: v1
kind: Service
metadata:
  name: flask-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: flask
  ports:
    - port: {{ .Values.flask.servicePort }}      
      targetPort: {{ .Values.flask.containerPort }} 
      protocol: TCP
