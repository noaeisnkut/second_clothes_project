name: CI/CD - Prod
#first-try
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'helm-charts/**'

env:
  IMAGE_NAME: noa10203040/flask_app
  HELM_CHART_PATH: helm-charts/myproject
  K8S_NAMESPACE: prod
  HELM_VALUES_FILE: values-prod.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Docker login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        IMAGE_TAG=${GITHUB_SHA::8}
        docker build -t $IMAGE_NAME:$IMAGE_TAG backend/
        docker push $IMAGE_NAME:$IMAGE_TAG
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
    - name: Update Helm values
      run: |
        yq e -i ".flask.image = \"${IMAGE_NAME}:${IMAGE_TAG}\"" $HELM_CHART_PATH/$HELM_VALUES_FILE
    - name: Install ArgoCD CLI
      run: |
        curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
        chmod +x /usr/local/bin/argocd
    - name: Sync ArgoCD application
      uses: devops-infra/action-argocd@v2
      with:
        argocd_server: ${{ secrets.ARGOCD_SERVER }}
        argocd_username: ${{ secrets.ARGOCD_USERNAME }}
        argocd_password: ${{ secrets.ARGOCD_PASSWORD }}
        app_name: flask-app
        method: sync
