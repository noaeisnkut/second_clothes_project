name: CI/CD - Prod
on:
  push:
    branches:
      - s3   
env:
  IMAGE_NAME: noa10203040/flask_app
  HELM_CHART_PATH: helm-chart
  HELM_VALUES_FILE: values-prod.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Docker login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        IMAGE_TAG=${GITHUB_SHA::8}
        docker build -t $IMAGE_NAME:$IMAGE_TAG backend/
        docker push $IMAGE_NAME:$IMAGE_TAG
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Update Helm values
      run: |
        yq e -i ".flask.image = \"${IMAGE_NAME}:${IMAGE_TAG}\"" $HELM_CHART_PATH/$HELM_VALUES_FILE

    - name: Commit and push Helm values update
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add $HELM_CHART_PATH/$HELM_VALUES_FILE
        git commit -m "Update Flask image to $IMAGE_NAME:$IMAGE_TAG"
        git push origin s3
