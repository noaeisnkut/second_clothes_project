# runci-cd-dev.yaml
name: CI/CD - Dev + Staging
on:
  push:
    branches:
      - s3
env:
  IMAGE_NAME: noa10203040/flask_app
  HELM_CHART_PATH: helm-chart
  DEV_VALUES_FILE: values-dev.yaml
  STAGING_VALUES_FILE: values-staging.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[dev]')
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Sync with remote branch
      run: |
        git fetch origin s3
        git reset --hard origin/s3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Docker login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        IMAGE_TAG=${GITHUB_SHA::8}
        docker build -t $IMAGE_NAME:$IMAGE_TAG backend/
        docker push $IMAGE_NAME:$IMAGE_TAG
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Update Helm values for dev
      run: |
        yq e -i ".flask.image = \"${IMAGE_NAME}:${IMAGE_TAG}\"" $HELM_CHART_PATH/$DEV_VALUES_FILE

    - name: Update Helm values for staging
      run: |
        yq e -i ".flask.image = \"${IMAGE_NAME}:${IMAGE_TAG}\"" $HELM_CHART_PATH/$STAGING_VALUES_FILE

    - name: Configure Git
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

    - name: Commit and push Helm values updates
      run: |
        git add $HELM_CHART_PATH/$DEV_VALUES_FILE $HELM_CHART_PATH/$STAGING_VALUES_FILE
        git commit -m "Update Flask image to $IMAGE_NAME:$IMAGE_TAG for dev + staging" || echo "No changes to commit"
        git push origin s3
