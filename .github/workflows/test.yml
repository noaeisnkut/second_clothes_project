name: run test and test project
on:
  push:
    branches:
      - s3

jobs:
  build-test-run-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          

      - name: Build and start containers
        run: docker compose -f ./infra/docker-compose.yml up --build -d

      - name: Wait for services to be ready
        run: sleep 15

      - name: Run tests in test container
        run: docker compose -f ./infra/docker-compose.yml run --rm test
        
      - name: Echo success
        if: success()
        run: docker compose -f ./infra/docker-compose.yml push flask_app

      - name: Echo failure
        if: failure()
        run: echo "The test failed - try again!"

      - name: Tear down containers
        run: docker compose -f ./infra/docker-compose.yml down -v
