name: CI/CD Test, Build & Push
on:
  push:
    branches:
      - s3

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and start containers for testing
        run: docker compose -f ./infra/docker-compose.yaml up --build -d
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }} 
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Wait for services to be ready
        run: sleep 15

      - name: Run tests in test container
        run: docker compose -f ./infra/docker-compose.yaml run --rm test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Tear down containers after test
        if: always() 
        run: docker compose -f ./infra/docker-compose.yaml down
      - name: Get image metadata (tags)
        if: success()
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/flask-app 
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Flask image
        if: success()
        uses: docker/build-and-push-action@v5
        with:
          context: . 
          file: ./backend/Dockerfile 
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          
      - name: Report failure
        if: failure()
        run: echo "The test failed - build and push skipped."