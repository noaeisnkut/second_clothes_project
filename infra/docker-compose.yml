services:
  flask_app:
    container_name: flask_app
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: flask_app:latest
    ports:
      - "5000:5000"
    volumes:
      - ../static/uploads:/app/static/uploads
    env_file:
      - ../database/cred.env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    container_name: mysql
    image: mysql:latest
    env_file:
      - ../database/pass_env1
    volumes:
      - ../mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    container_name: test_app
    image: test:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - flask_app
      - mysql
    env_file:
      - ../database/pass_env1
    volumes:
      - .:/app

    command: ["pytest", "app_test.py"]
volumes:
  mysql-data: