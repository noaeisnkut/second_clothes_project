<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Add a New Clothing Item</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div>
            {% for category, message in messages %}
                <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<form action="{{ url_for('add') }}" method="POST" enctype="multipart/form-data">
    <label for="title">Clothing Title:</label>
    <input type="text" name="title" id="title" required>

    <label for="price">Price (₪):</label>
    <input type="text" name="price" id="price" required pattern="^\d+(\.\d{1,2})?$" title="Enter a valid number, e.g., 25 or 25.99">

    <label for="image">Upload Image:</label>
    <input type="file" name="image" id="image" accept="image/*">

    <label for="contact">Contact Information (Phone or Email):</label>
    <input type="text" name="contact" id="contact" placeholder="Phone or Email" required>

    <label for="size">Size</label>
    <input type="text" name="size" id="size" placeholder="e.g., S, M, L, XL">

    <button type="submit">Add Product</button>
</form>

<p><a href="{{ url_for('index') }}"><button>Back to Home</button></a></p>

</body>
</html>
