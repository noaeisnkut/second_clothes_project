services:
  flask_app:
    container_name: flask_app
    build:
      context: .
      dockerfile: Dockerfile
    image: noa10203040/flask_app:latest
    ports:
      - "5000:5000"
    volumes:
      - ./static/uploads:/app/static/uploads
    env_file:
      - pass_env1
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    container_name: mysql
    image: mysql:latest
    env_file:
      - db/cred.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    container_name: test_app
    image: noa10203040/test:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - flask_app
      - mysql
    env_file:
      - pass_env1
    volumes:
      - .:/app

    command: ["pytest", "app_test.py"]
volumes:
  mysql-data:

